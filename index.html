<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Advanced Professional SEO & Branding Meta Tags -->
    <title>VexorNull | Live Code Tester & Developer Notepad Studio</title>
    <meta name="title" content="VexorNull | Live Code Tester & Developer Notepad Studio">
    <meta name="description" content="Professional live code testing notepad studio with instant real-time output preview. Developed by Tanveer Hussain (@vexornull).">
    <meta name="author" content="Tanveer Hussain">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://vexornull.github.io/">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#3b82f6', dark: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .code-font { font-family: 'Fira Code', monospace; color-scheme: dark; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <!-- Header Navigation -->
    <header class="w-full py-3 px-4 sm:px-6 border-b border-slate-800/80 flex justify-between items-center glass sticky top-0 z-50">
        <div class="flex items-center space-x-2.5">
            <div class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-ping"></div>
            <span class="font-extrabold text-sm sm:text-base tracking-wider text-white">VEXOR<span class="text-blue-500">NULL</span> <span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-800 text-slate-300 ml-1">NOTEPAD v1.1</span></span>
        </div>
        
        <!-- Interactive View Switcher Dock -->
        <div class="flex items-center bg-slate-900 border border-slate-800 p-1 rounded-xl shadow-lg">
            <button onclick="switchView('code')" id="btnCode" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-blue-600 text-white flex items-center gap-1.5 shadow">
                <i class="fa-solid fa-code"></i> <span class="hidden sm:inline">Back to</span> Code
            </button>
            <button onclick="switchView('live')" id="btnLive" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-white flex items-center gap-1.5">
                <i class="fa-solid fa-play text-emerald-400"></i> Live Output
            </button>
        </div>

        <div class="hidden md:block text-xs text-slate-400 border-l border-slate-800 pl-4">
            By <a href="https://Instagram.com/vexornull" target="_blank" class="text-blue-400 hover:underline font-semibold">@vexornull</a>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="max-w-7xl mx-auto px-3 sm:px-6 py-4 w-full flex-grow flex flex-col">
        
        <!-- Notepad Code Editor View -->
        <div id="workspaceCode" class="flex flex-col flex-grow space-y-3">
            <div class="flex justify-between items-center bg-slate-900/80 border border-slate-800 p-3 rounded-xl">
                <div class="flex items-center gap-2 text-xs text-slate-300 font-mono">
                    <i class="fa-solid fa-file-pen text-blue-400"></i> Live Notepad & Code Testing Workspace
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="clearNotepad()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition border border-slate-700">
                        <i class="fa-solid fa-trash-can"></i> Clear
                    </button>
                    <button onclick="launchLivePreview()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-1.5 rounded-lg transition shadow-lg flex items-center gap-1.5">
                        <i class="fa-solid fa-bolt"></i> Live Output <i class="fa-solid fa-arrow-right text-[10px]"></i>
                    </button>
                </div>
            </div>

            <!-- Code Input Textarea -->
            <textarea id="notepadInput" placeholder="Yahan apna HTML, CSS ya JS code paste karein..." class="w-full flex-grow min-h-[65vh] bg-slate-900/90 border border-slate-800 rounded-2xl p-4 text-xs sm:text-sm text-slate-200 code-font focus:outline-none focus:border-blue-500 leading-relaxed shadow-inner resize-none"></textarea>
        </div>

        <!-- Live Output Sandbox View -->
        <div id="workspaceLive" class="hidden flex-col flex-grow space-y-3">
            <div class="flex justify-between items-center bg-slate-900/80 border border-slate-800 p-3 rounded-xl">
                <div class="flex items-center gap-2 text-xs text-emerald-400 font-mono">
                    <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div> Live Output Running Smoothly
                </div>
                <button onclick="switchView('code')" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-lg">
                    <i class="fa-solid fa-arrow-left"></i> Back to Code
                </button>
            </div>

            <!-- Sandboxed Output Frame -->
            <div class="w-full flex-grow border border-slate-800 rounded-2xl overflow-hidden bg-white shadow-2xl min-h-[70vh]">
                <iframe id="liveSandboxFrame" sandbox="allow-scripts allow-modals allow-forms" class="w-full h-full border-0"></iframe>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-900 mt-2">
        Developer Studio Built by <span class="text-slate-300 font-medium">Tanveer Hussain</span> (<a href="https://Instagram.com/vexornull" target="_blank" class="text-blue-400 hover:underline">@vexornull</a>)
    </footer>

    <!-- Script Controller -->
    <script>
        const notepadInput = document.getElementById('notepadInput');

        window.onload = function() {
            const savedNotepadCode = localStorage.getItem('vexornull_notepad_code');
            if (savedNotepadCode) {
                notepadInput.value = savedNotepadCode;
            } else {
                notepadInput.value = `<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <title>Test Page</title>\n    <style>\n        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #0f172a; color: #fff; }\n        h1 { color: #3b82f6; }\n    </style>\n</head>\n<body>\n    <h1>Hello Tanveer!</h1>\n    <p>Aapka live notepad successfully chal raha hai.</p>\n</body>\n</html>`;
            }
        };

        notepadInput.addEventListener('input', function() {
            localStorage.setItem('vexornull_notepad_code', notepadInput.value);
        });

        function clearNotepad() {
            if(confirm('Kya aap saara code clear karna chahte hain?')) {
                notepadInput.value = '';
                localStorage.removeItem('vexornull_notepad_code');
            }
        }

        function switchView(viewName) {
            const codeWorkspace = document.getElementById('workspaceCode');
            const liveWorkspace = document.getElementById('workspaceLive');
            const btnCode = document.getElementById('btnCode');
            const btnLive = document.getElementById('btnLive');

            if (viewName === 'live') {
                launchLivePreview();
                codeWorkspace.classList.add('hidden');
                codeWorkspace.classList.remove('flex');
                liveWorkspace.classList.remove('hidden');
                liveWorkspace.classList.add('flex');
                
                btnCode.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-white flex items-center gap-1.5";
                btnLive.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-emerald-600 text-white flex items-center gap-1.5 shadow";
            } else {
                liveWorkspace.classList.add('hidden');
                liveWorkspace.classList.remove('flex');
                codeWorkspace.classList.remove('hidden');
                codeWorkspace.classList.add('flex');

                btnLive.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-white flex items-center gap-1.5";
                btnCode.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-blue-600 text-white flex items-center gap-1.5 shadow";
            }
        }

        function launchLivePreview() {
            const userCode = notepadInput.value;
            localStorage.setItem('vexornull_notepad_code', userCode);
            
            const iframe = document.getElementById('liveSandboxFrame');
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(userCode);
            iframeDoc.close();

            document.getElementById('workspaceCode').classList.add('hidden');
            document.getElementById('workspaceCode').classList.remove('flex');
            document.getElementById('workspaceLive').classList.remove('hidden');
            document.getElementById('workspaceLive').classList.add('flex');

            document.getElementById('btnCode').className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-white flex items-center gap-1.5";
            document.getElementById('btnLive').className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-emerald-600 text-white flex items-center gap-1.5 shadow";
        }
    </script>
</body>
</html>
