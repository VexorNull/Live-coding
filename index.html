<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- ========================================== -->
    <!-- ADVANCED ENTERPRISE SEO & METADATA -->
    <!-- ========================================== -->
    <title>VexorNull | Ultimate Enterprise Multi-Tab Code Studio</title>
    <meta name="title" content="VexorNull | Ultimate Enterprise Multi-Tab Code Studio">
    <meta name="description" content="Professional universal multi-language and multi-file code testing studio supporting full website development, split HTML/CSS/JS tabs, and live sandbox execution. Developed by Tanveer Hussain.">
    <meta name="keywords" content="universal code tester, multi file editor, html css js runner, developer studio, online code runner, vexornull, tanveer hussain">
    <meta name="author" content="Tanveer Hussain">
    <meta name="creator" content="Tanveer Hussain">
    <meta name="publisher" content="VexorNull Studio">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0f172a">
    <link rel="canonical" href="https://vexornull.github.io/Live-coding/">
    <link rel="icon" type="image/png" href="https://vexornull.github.io/favicon/favicon.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#3b82f6', dark: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .code-font { font-family: 'Fira Code', monospace; color-scheme: dark; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .tab-active { background: rgba(59, 130, 246, 0.15); border-color: #3b82f6; color: #60a5fa; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <!-- Header Navigation -->
    <header class="w-full py-3 px-4 sm:px-6 border-b border-slate-800/80 flex justify-between items-center glass sticky top-0 z-50">
        <div class="flex items-center space-x-2.5">
            <div class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-ping"></div>
            <span class="font-extrabold text-sm sm:text-base tracking-wider text-white">VEXOR<span class="text-blue-500">NULL</span> <span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-800 text-slate-300 ml-1">ENTERPRISE v6.0</span></span>
        </div>
        
        <!-- Interactive View Switcher Dock -->
        <div class="flex items-center bg-slate-900 border border-slate-800 p-1 rounded-xl shadow-lg">
            <button type="button" id="btnCode" onclick="switchMainView('code')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-blue-600 text-white flex items-center gap-1.5 shadow">
                <i class="fa-solid fa-code"></i> <span class="hidden sm:inline">Workspace</span>
            </button>
            <button type="button" id="btnLive" onclick="switchMainView('live')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-white flex items-center gap-1.5">
                <i class="fa-solid fa-globe text-emerald-400"></i> Full Website Live Preview
            </button>
        </div>

        <div class="hidden md:block text-xs text-slate-400 border-l border-slate-800 pl-4">
            By <a href="https://Instagram.com/vexornull" target="_blank" class="text-blue-400 hover:underline font-semibold">@vexornull</a>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="max-w-7xl mx-auto px-3 sm:px-6 py-4 w-full flex-grow flex flex-col">
        
        <!-- Multi-Tab Code Editor View -->
        <div id="workspaceCode" class="flex flex-col flex-grow space-y-3">
            
            <!-- Editor Toolbar & File Tabs -->
            <div class="flex justify-between items-center bg-slate-900/80 border border-slate-800 p-2.5 rounded-xl flex-wrap gap-2">
                <!-- File Tabs Switcher -->
                <div class="flex items-center gap-1.5 overflow-x-auto">
                    <button type="button" id="tabHtmlBtn" onclick="switchTab('html')" class="px-3 py-1.5 rounded-lg text-xs font-mono font-bold transition border border-slate-800 tab-active flex items-center gap-1.5 cursor-pointer">
                        <i class="fa-brands fa-html5 text-orange-400"></i> index.html
                    </button>
                    <button type="button" id="tabCssBtn" onclick="switchTab('css')" class="px-3 py-1.5 rounded-lg text-xs font-mono font-medium transition border border-slate-800 bg-slate-900 text-slate-400 hover:text-white flex items-center gap-1.5 cursor-pointer">
                        <i class="fa-brands fa-css3-alt text-blue-400"></i> style.css
                    </button>
                    <button type="button" id="tabJsBtn" onclick="switchTab('js')" class="px-3 py-1.5 rounded-lg text-xs font-mono font-medium transition border border-slate-800 bg-slate-900 text-slate-400 hover:text-white flex items-center gap-1.5 cursor-pointer">
                        <i class="fa-brands fa-js text-yellow-400"></i> script.js
                    </button>
                </div>

                <!-- Global Actions -->
                <div class="flex items-center gap-2 flex-wrap">
                    <button type="button" onclick="copyAllCode()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition border border-slate-700 cursor-pointer flex items-center gap-1">
                        <i class="fa-solid fa-copy"></i> Copy All
                    </button>
                    <button type="button" onclick="downloadProject()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition border border-slate-700 cursor-pointer flex items-center gap-1">
                        <i class="fa-solid fa-download"></i> Export Website
                    </button>
                    <button type="button" onclick="switchMainView('live')" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-1.5 rounded-lg transition shadow-lg flex items-center gap-1.5 cursor-pointer">
                        <i class="fa-solid fa-play"></i> Run Website <i class="fa-solid fa-arrow-right text-[10px]"></i>
                    </button>
                </div>
            </div>

            <!-- Code Textareas for Individual Files -->
            <div class="flex-grow flex flex-col relative min-h-[65vh]">
                <!-- HTML Editor -->
                <textarea id="codeHtml" class="w-full flex-grow bg-slate-900/90 border border-slate-800 rounded-2xl p-4 text-xs sm:text-sm text-slate-200 code-font focus:outline-none focus:border-blue-500 leading-relaxed shadow-inner resize-none spellcheck='false'"></textarea>
                
                <!-- CSS Editor (Hidden by default) -->
                <textarea id="codeCss" class="hidden w-full flex-grow bg-slate-900/90 border border-slate-800 rounded-2xl p-4 text-xs sm:text-sm text-slate-200 code-font focus:outline-none focus:border-blue-500 leading-relaxed shadow-inner resize-none spellcheck='false'"></textarea>
                
                <!-- JS Editor (Hidden by default) -->
                <textarea id="codeJs" class="hidden w-full flex-grow bg-slate-900/90 border border-slate-800 rounded-2xl p-4 text-xs sm:text-sm text-slate-200 code-font focus:outline-none focus:border-blue-500 leading-relaxed shadow-inner resize-none spellcheck='false'"></textarea>
            </div>
        </div>

        <!-- Live Output Website Preview View -->
        <div id="workspaceLive" class="hidden flex-col flex-grow space-y-3">
            <div class="flex justify-between items-center bg-slate-900/80 border border-slate-800 p-3 rounded-xl flex-wrap gap-2">
                <div class="flex items-center gap-2 text-xs text-emerald-400 font-mono">
                    <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div> Full Website Execution Active (HTML + CSS + JS)
                </div>
                <div class="flex items-center gap-2">
                    <button type="button" onclick="refreshWebsitePreview()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition border border-slate-700 cursor-pointer flex items-center gap-1">
                        <i class="fa-solid fa-rotate"></i> Reload Preview
                    </button>
                    <button type="button" onclick="switchMainView('code')" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-lg cursor-pointer">
                        <i class="fa-solid fa-arrow-left"></i> Back to Editor
                    </button>
                </div>
            </div>

            <!-- Sandboxed Full Website Output Frame -->
            <div class="w-full flex-grow border border-slate-800 rounded-2xl overflow-hidden bg-slate-900 shadow-2xl min-h-[70vh] flex flex-col">
                <iframe id="liveWebsiteFrame" sandbox="allow-scripts allow-modals allow-forms allow-same-origin allow-popups" class="w-full flex-grow border-0 bg-white"></iframe>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-900 mt-2">
        Enterprise Studio Built by <span class="text-slate-300 font-medium">Tanveer Hussain</span> (<a href="https://Instagram.com/vexornull" target="_blank" class="text-blue-400 hover:underline">@vexornull</a>)
    </footer>

    <!-- Script Controller -->
    <script>
        const codeHtml = document.getElementById('codeHtml');
        const codeCss = document.getElementById('codeCss');
        const codeJs = document.getElementById('codeJs');

        window.onload = function() {
            const savedHtml = localStorage.getItem('vex_html');
            const savedCss = localStorage.getItem('vex_css');
            const savedJs = localStorage.getItem('vex_js');

            if (savedHtml !== null) codeHtml.value = savedHtml;
            else codeHtml.value = `<!-- Tanveer Hussain (@vexornull) - Profile Template -->
<div class="profile-card">
    <a href="https://drive.google.com/file/d/1NzqmZp796ksKZrtpuMabgqpFXTGV3YIR/view?usp=drivesdk" target="_blank" class="avatar-link" title="View Experience Letter">
        <div class="avatar">TH</div>
        <div class="badge-icon"><i class="fa-solid fa-arrow-up-right-from-square"></i></div>
    </a>
    <h1>Tanveer Hussain</h1>
    <p class="handle">@vexornull | Full-Stack Developer</p>
    <p class="bio">Welcome to VexorNull Studio! Upar di gayi profile picture par click karke aap experience letter dekh sakte hain.</p>
    <button onclick="greetUser()">Say Hello</button>
</div>`;

            if (savedCss !== null) codeCss.value = savedCss;
            else codeCss.value = `/* Modern Portfolio Styles */
body {
    background: #030712;
    color: #f8fafc;
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
.profile-card {
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 35px;
    border-radius: 24px;
    text-align: center;
    max-width: 360px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
}
.avatar-link {
    display: inline-block;
    position: relative;
    cursor: pointer;
    text-decoration: none;
}
.avatar {
    width: 80px;
    height: 80px;
    margin: 0 auto 15px auto;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: white;
    font-size: 28px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 22px;
    box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.5);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    border: 2px solid rgba(255, 255, 255, 0.1);
}
.avatar-link:hover .avatar {
    transform: scale(1.05);
    box-shadow: 0 15px 25px -5px rgba(59, 130, 246, 0.7);
    border-color: #60a5fa;
}
.badge-icon {
    position: absolute;
    bottom: 12px;
    right: -2px;
    background: #2563eb;
    color: white;
    font-size: 10px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #0f172a;
}
h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; color: #ffffff; }
.handle { font-size: 13px; color: #60a5fa; font-family: monospace; margin-bottom: 15px; }
.bio { font-size: 13px; color: #94a3b8; line-height: 1.6; margin-bottom: 25px; }
button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
}
button:hover { background: #1d4ed8; transform: translateY(-1px); }`;

            if (savedJs !== null) codeJs.value = savedJs;
            else codeJs.value = `// JavaScript Interactivity
function greetWorkspace() {
    console.log("VexorNull Studio v6.0 Initialized successfully by Tanveer Hussain.");
}
greetWorkspace();

function greetUser() {
    alert("Hello! Aap VexorNull Code Studio use kar rahe hain. Profile picture par click karke Google Drive ka experience letter check kar sakte hain!");
}`;
        };

        // Auto-save on input
        codeHtml.addEventListener('input', () => localStorage.setItem('vex_html', codeHtml.value));
        codeCss.addEventListener('input', () => localStorage.setItem('vex_css', codeCss.value));
        codeJs.addEventListener('input', () => localStorage.setItem('vex_js', codeJs.value));

        // Tab Switching Logic
        function switchTab(tab) {
            codeHtml.classList.add('hidden');
            codeCss.classList.add('hidden');
            codeJs.classList.add('hidden');

            document.getElementById('tabHtmlBtn').className = "px-3 py-1.5 rounded-lg text-xs font-mono font-medium transition border border-slate-800 bg-slate-900 text-slate-400 hover:text-white flex items-center gap-1.5 cursor-pointer";
            document.getElementById('tabCssBtn').className = "px-3 py-1.5 rounded-lg text-xs font-mono font-medium transition border border-slate-800 bg-slate-900 text-slate-400 hover:text-white flex items-center gap-1.5 cursor-pointer";
            document.getElementById('tabJsBtn').className = "px-3 py-1.5 rounded-lg text-xs font-mono font-medium transition border border-slate-800 bg-slate-900 text-slate-400 hover:text-white flex items-center gap-1.5 cursor-pointer";

            if (tab === 'html') {
                codeHtml.classList.remove('hidden');
                document.getElementById('tabHtmlBtn').className = "px-3 py-1.5 rounded-lg text-xs font-mono font-bold transition border border-slate-800 tab-active flex items-center gap-1.5 cursor-pointer";
            } else if (tab === 'css') {
                codeCss.classList.remove('hidden');
                document.getElementById('tabCssBtn').className = "px-3 py-1.5 rounded-lg text-xs font-mono font-bold transition border border-slate-800 tab-active flex items-center gap-1.5 cursor-pointer";
            } else if (tab === 'js') {
                codeJs.classList.remove('hidden');
                document.getElementById('tabJsBtn').className = "px-3 py-1.5 rounded-lg text-xs font-mono font-bold transition border border-slate-800 tab-active flex items-center gap-1.5 cursor-pointer";
            }
        }

        // Main Workspace vs Live Preview Switcher
        function switchMainView(view) {
            const codeWorkspace = document.getElementById('workspaceCode');
            const liveWorkspace = document.getElementById('workspaceLive');
            const btnCode = document.getElementById('btnCode');
            const btnLive = document.getElementById('btnLive');

            if (view === 'live') {
                const combinedWebsiteCode = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"><\/script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ${codeCss.value}
    </style>
</head>
<body>
    ${codeHtml.value}
    <script>
        try {
            ${codeJs.value}
        } catch(e) {
            console.error(e);
        }
    <\/script>
</body>
</html>`;

                const iframe = document.getElementById('liveWebsiteFrame');
                const blob = new Blob([combinedWebsiteCode], { type: 'text/html' });
                iframe.src = URL.createObjectURL(blob);

                codeWorkspace.classList.add('hidden');
                codeWorkspace.classList.remove('flex');
                liveWorkspace.classList.remove('hidden');
                liveWorkspace.classList.add('flex');

                btnCode.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-white flex items-center gap-1.5";
                btnLive.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-emerald-600 text-white flex items-center gap-1.5 shadow";
            } else {
                liveWorkspace.classList.add('hidden');
                liveWorkspace.classList.remove('flex');
                codeWorkspace.classList.remove('hidden');
                codeWorkspace.classList.add('flex');

                btnLive.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-white flex items-center gap-1.5";
                btnCode.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-blue-600 text-white flex items-center gap-1.5 shadow";
            }
        }

        function refreshWebsitePreview() {
            switchMainView('live');
        }

        function copyAllCode() {
            const fullBundle = `/* --- index.html --- */\n${codeHtml.value}\n\n/* --- style.css --- */\n${codeCss.value}\n\n/* --- script.js --- */\n${codeJs.value}`;
            navigator.clipboard.writeText(fullBundle).then(() => {
                alert('All files code successfully copied!');
            });
        }

        function downloadProject() {
            const fullBundle = `<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<title>VexorNull Exported Website</title>\n<script src="https://cdn.tailwindcss.com"><\/script>\n<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">\n<style>\n${codeCss.value}\n</style>\n</head>\n<body>\n${codeHtml.value}\n<script>\n${codeJs.value}\n<\/script>\n</body>\n</html>`;
            const blob = new Blob([fullBundle], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
